<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#4c1d95"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#g1)"/>
  <!-- Ticket body -->
  <rect x="80" y="160" width="352" height="192" rx="20" fill="url(#g2)" opacity="0.9"/>
  <!-- Ticket notch left -->
  <circle cx="80" cy="256" r="28" fill="#1e1b4b"/>
  <!-- Ticket notch right -->
  <circle cx="432" cy="256" r="28" fill="#1e1b4b"/>
  <!-- Dashed divider -->
  <line x1="108" y1="256" x2="404" y2="256" stroke="white" stroke-width="3" stroke-dasharray="12,8" opacity="0.4"/>
  <!-- Stars decoration -->
  <circle cx="160" cy="210" r="6" fill="white" opacity="0.6"/>
  <circle cx="190" cy="200" r="4" fill="white" opacity="0.4"/>
  <circle cx="350" cy="310" r="5" fill="white" opacity="0.5"/>
  <circle cx="380" cy="300" r="3" fill="white" opacity="0.3"/>
  <!-- Lightning bolt icon -->
  <polygon points="270,195 240,260 258,260 242,317 290,248 268,248 288,195" fill="white" opacity="0.95"/>
</svg>